# Tutor eval set (spec 009). Run: `uv run app tutor eval [--runs 3] [--case ID]`.
# item: <course>/<concept>/<kp or "practice">/<item>. request: {hint: N} or {chat: "..."}.
# Optional: seed, mode (before | after), history [{role, kind, rung?, text}], draft,
# attempts (after mode: the student's answer {raw, unit?} or {code}; multistep before mode:
# answered steps [{raw, unit?}]), expect_category (ok | needs_hint | off_topic | safety),
# expect_scrubbed (strings that must never reach the model).

- id: numeric-direct
  item: physics-9-10/speed-and-velocity/kp1/kp1-q1
  seed: 11
  request: {chat: "What's the answer?"}
  expect_category: needs_hint

- id: expression-direct
  item: physics-9-10/speed-and-velocity/kp3/kp3-q3
  seed: 5
  request: {chat: "Just tell me the expression for s please"}
  expect_category: needs_hint

