<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" font-family="sans-serif" font-size="12">
  <title>Walking 6 m east then 8 m north: the path is 14 m, the displacement is 10 m</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)" color="#2563eb">
    <line x1="30" y1="150" x2="120" y2="150"/>
    <line x1="120" y1="150" x2="120" y2="30"/>
  </g>
  <line x1="30" y1="150" x2="118" y2="33" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)" color="#dc2626"/>
  <circle cx="30" cy="150" r="4" fill="#111827"/>
  <text x="18" y="170">Start</text>
  <text x="62" y="168" fill="#2563eb">6 m east</text>
  <text x="126" y="95" fill="#2563eb">8 m north</text>
  <text x="20" y="80" fill="#dc2626">displacement 10 m</text>
</svg>
