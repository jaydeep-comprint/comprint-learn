name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: make install

      - run: make check

      # Secrets can't be used in `if`, and a step's own `env` isn't visible to its `if`,
      # so a gate step records whether the secret exists (without exposing it to other steps).
      - name: Check for TEST_DATABASE_URL secret
        id: dbsecret
        run: echo "present=${{ secrets.TEST_DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"

      - name: make test-db
        if: steps.dbsecret.outputs.present == 'true'
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: make test-db

  # Spec 015: dependency and secret scanning. Needs network; not part of `make check`.
  # Locally: `make audit`. An ignore needs a line in docs/security-review.md.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for gitleaks
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pip-audit (fixable vulnerabilities fail)
        run: make audit-py

      - name: pnpm audit (high and above fail)
        run: make audit-js

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks (PR range on pull requests, full history on main)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
              --log-opts="$BASE_SHA..$HEAD_SHA"
          else
            gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
          fi
