- id: assign-vs-compare
  title: "= and == are the same"
  description: Uses `=` (assignment) where a comparison `==` is needed, or reads `x = 5` as "x equals 5?".
- id: range-includes-stop
  title: range() includes the stop value
  description: Thinks `range(a, b)` goes up to and including `b`, so counts one value too many.
- id: string-number-concat
  title: Strings and numbers add together
  description: Expects `"5" + 3` to give 8 or "53", instead of a TypeError; forgets to convert with int() or str().
- id: slash-gives-int
  title: "/ gives a whole number"
  description: Thinks `7 / 2` gives 3; in Python 3 `/` always gives a float (3.5) and `//` is floor division.
- id: all-branches-run
  title: Every true branch runs
  description: Thinks every if/elif/else branch whose condition is true runs, instead of only the first true one.
- id: while-updates-itself
  title: The loop variable changes by itself
  description: Forgets to update the variable in a while loop's condition, so the loop never ends.
- id: reset-inside-loop
  title: Accumulator set inside the loop
  description: Puts `total = 0` inside the loop body, so the total is reset on every pass.
- id: names-can-be-anything
  title: Any word can be a variable name
  description: Uses names with hyphens, spaces, a leading digit or a keyword (like `class`) as variable names.
- id: index-starts-at-one
  title: The first item is at index 1
  description: Thinks indexing starts at 1, so reads `s[1]` as the first character or item and `s[len(s)]` as the last (an IndexError).
- id: slice-includes-end
  title: A slice includes its end index
  description: Thinks `s[a:b]` includes the item at index `b`, so expects one item too many (like range-includes-stop).
- id: print-is-return
  title: print() gives a value back
  description: Uses `print` inside a function where `return` is needed, then expects the caller to get the value (it gets `None`).
- id: strings-are-mutable
  title: Strings can be changed in place
  description: Expects `s[0] = "H"` or `s.upper()` on its own to change `s`; strings are immutable, so methods return a new string.
- id: append-returns-list
  title: append() gives back the new list
  description: Writes `nums = nums.append(x)`; `append` changes the list in place and returns `None`.
- id: dict-key-vs-value
  title: Looking up a dictionary by its value
  description: Mixes up keys and values, e.g. expects `d["Asha"]` to work when "Asha" is a value, or a `for` loop over a dict to give the values.
- id: dict-by-position
  title: A dictionary's pairs have index numbers
  description: Uses `d[0]` or `d[1]` to mean the first or second pair, as with a list; a dictionary is looked up by key, so this is a KeyError unless 0 or 1 happens to be a key.
- id: dict-keeps-duplicates
  title: A dictionary can hold the same key twice
  description: 'Expects `{"Asha": 10, "Asha": 20}` to keep both pairs or the first value; keys are unique, the last value wins, and `d[k] = v` on an existing key replaces its value.'
- id: def-runs-body
  title: Defining a function runs it
  description: Thinks the body of a `def` runs when the function is defined, so expects output from a function that is never called.
- id: local-visible-outside
  title: Variables inside a function are seen outside
  description: Expects a variable assigned inside a function to exist, or to change a same-named variable, outside it; it is local, so outside it is a NameError or the outer variable keeps its value.
- id: default-must-be-passed
  title: Every parameter must be given
  description: Thinks leaving out an argument that has a default value is an error; the default is used instead.
