<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" font-family="sans-serif" font-size="11">
  <title>Velocity–time graph: from rest to 10 m/s in 5 s, steady at 10 m/s until 10 s, then down to rest at 14 s</title>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="30" x2="80" y2="180"/><line x1="110" y1="30" x2="110" y2="180"/><line x1="140" y1="30" x2="140" y2="180"/><line x1="170" y1="30" x2="170" y2="180"/><line x1="200" y1="30" x2="200" y2="180"/><line x1="230" y1="30" x2="230" y2="180"/><line x1="260" y1="30" x2="260" y2="180"/><line x1="290" y1="30" x2="290" y2="180"/>
    <line x1="50" y1="144" x2="290" y2="144"/><line x1="50" y1="108" x2="290" y2="108"/><line x1="50" y1="72" x2="290" y2="72"/><line x1="50" y1="36" x2="290" y2="36"/>
  </g>
  <polygon points="50,180 125,60 200,60 260,180" fill="#2563eb" fill-opacity="0.12"/>
  <g stroke="#111827" stroke-width="1.5"><line x1="50" y1="180" x2="296" y2="180"/><line x1="50" y1="180" x2="50" y2="22"/></g>
  <g fill="#111827" text-anchor="middle">
    <text x="50" y="195">0</text><text x="80" y="195">2</text><text x="110" y="195">4</text><text x="140" y="195">6</text><text x="170" y="195">8</text><text x="200" y="195">10</text><text x="230" y="195">12</text><text x="260" y="195">14</text><text x="290" y="195">16</text>
    <text x="170" y="213">time (s)</text>
  </g>
  <g fill="#111827" text-anchor="end">
    <text x="44" y="184">0</text><text x="44" y="148">3</text><text x="44" y="112">6</text><text x="44" y="76">9</text><text x="44" y="40">12</text>
  </g>
  <text x="12" y="105" fill="#111827" transform="rotate(-90 12 105)" text-anchor="middle">velocity (m/s)</text>
  <polyline points="50,180 125,60 200,60 260,180" fill="none" stroke="#2563eb" stroke-width="2.5"/>
</svg>
