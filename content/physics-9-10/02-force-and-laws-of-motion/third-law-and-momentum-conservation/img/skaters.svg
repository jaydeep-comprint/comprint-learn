<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" font-family="sans-serif" font-size="12">
  <title>Two skaters push apart: Vikram pushes Asha left with 120 N and Asha pushes Vikram right with 120 N</title>
  <line x1="10" y1="170" x2="350" y2="170" stroke="#93c5fd" stroke-width="3"/>
  <text x="180" y="190" fill="#6b7280" text-anchor="middle">smooth ice</text>
  <g fill="#fde68a" stroke="#111827" stroke-width="1.5">
    <circle cx="150" cy="50" r="13"/>
    <rect x="137" y="66" width="26" height="54" rx="6"/>
    <circle cx="214" cy="44" r="15"/>
    <rect x="198" y="62" width="32" height="58" rx="6"/>
  </g>
  <g stroke="#111827" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="80" x2="196" y2="80"/>
    <line x1="144" y1="120" x2="140" y2="166"/><line x1="156" y1="120" x2="160" y2="166"/>
    <line x1="206" y1="120" x2="202" y2="166"/><line x1="222" y1="120" x2="226" y2="166"/>
  </g>
  <g fill="#111827" text-anchor="middle">
    <text x="150" y="20">Asha, 40 kg</text>
    <text x="214" y="20">Vikram, 60 kg</text>
  </g>
  <g stroke="#dc2626" stroke-width="3" fill="#dc2626">
    <line x1="135" y1="100" x2="62" y2="100"/>
    <polygon points="52,100 66,93 66,107" stroke="none"/>
    <line x1="232" y1="100" x2="305" y2="100"/>
    <polygon points="315,100 301,93 301,107" stroke="none"/>
  </g>
  <g fill="#dc2626" text-anchor="middle">
    <text x="92" y="92">120 N</text>
    <text x="92" y="122" font-size="10">on Asha</text>
    <text x="275" y="92">120 N</text>
    <text x="275" y="122" font-size="10">on Vikram</text>
  </g>
</svg>
