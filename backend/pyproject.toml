[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sentry-sdk[fastapi]>=2.72.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "sympy>=1.14.0",
    "typer>=0.27.3",
]

[project.scripts]
app = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
loadtest = [
    "locust>=2.47.0",
    "pg8000>=1.31.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic", "loadtest"]

[[tool.mypy.overrides]]
# SymPy ships no type information.
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, so DB tests can share one engine (asyncpg connections are
# bound to the loop that opened them; reconnecting to the hosted DB costs seconds per test).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs a real Postgres (TEST_DATABASE_URL); run with `make test-db`"]

[[tool.mypy.overrides]]
# asyncpg ships no type information (used directly only for the test-DB lock, spec 015); the
# load-test tools are an optional dependency group.
module = ["asyncpg", "asyncpg.*", "locust", "locust.*", "pg8000", "pg8000.*", "gevent", "gevent.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Locust is in the optional `loadtest` group (absent in `make check`): its classes are `Any`.
module = ["loadtest.locustfile"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
