<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" font-family="sans-serif" font-size="11">
  <title>Distance–time graph: 20 m in the first 4 s, flat at 20 m from 4 s to 8 s, then up to 40 m at 10 s</title>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="98" y1="40" x2="98" y2="180"/><line x1="146" y1="40" x2="146" y2="180"/><line x1="194" y1="40" x2="194" y2="180"/><line x1="242" y1="40" x2="242" y2="180"/><line x1="290" y1="40" x2="290" y2="180"/>
    <line x1="50" y1="145" x2="290" y2="145"/><line x1="50" y1="110" x2="290" y2="110"/><line x1="50" y1="75" x2="290" y2="75"/><line x1="50" y1="40" x2="290" y2="40"/>
  </g>
  <g stroke="#111827" stroke-width="1.5"><line x1="50" y1="180" x2="296" y2="180"/><line x1="50" y1="180" x2="50" y2="28"/></g>
  <g fill="#111827" text-anchor="middle">
    <text x="50" y="195">0</text><text x="98" y="195">2</text><text x="146" y="195">4</text><text x="194" y="195">6</text><text x="242" y="195">8</text><text x="290" y="195">10</text>
    <text x="170" y="213">time (s)</text>
  </g>
  <g fill="#111827" text-anchor="end">
    <text x="44" y="184">0</text><text x="44" y="149">10</text><text x="44" y="114">20</text><text x="44" y="79">30</text><text x="44" y="44">40</text>
  </g>
  <text x="12" y="110" fill="#111827" transform="rotate(-90 12 110)" text-anchor="middle">distance (m)</text>
  <polyline points="50,180 146,110 242,110 290,40" fill="none" stroke="#2563eb" stroke-width="2.5"/>
</svg>
