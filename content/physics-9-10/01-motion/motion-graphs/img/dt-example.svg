<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" font-family="sans-serif" font-size="11">
  <title>Distance–time graph: car A goes 40 m in 10 s, car B goes 10 m in 10 s, both straight lines from the origin</title>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="98" y1="30" x2="98" y2="180"/><line x1="146" y1="30" x2="146" y2="180"/><line x1="194" y1="30" x2="194" y2="180"/><line x1="242" y1="30" x2="242" y2="180"/><line x1="290" y1="30" x2="290" y2="180"/>
    <line x1="50" y1="150" x2="290" y2="150"/><line x1="50" y1="120" x2="290" y2="120"/><line x1="50" y1="90" x2="290" y2="90"/><line x1="50" y1="60" x2="290" y2="60"/><line x1="50" y1="30" x2="290" y2="30"/>
  </g>
  <g stroke="#111827" stroke-width="1.5"><line x1="50" y1="180" x2="296" y2="180"/><line x1="50" y1="180" x2="50" y2="22"/></g>
  <g fill="#111827" text-anchor="middle">
    <text x="50" y="195">0</text><text x="98" y="195">2</text><text x="146" y="195">4</text><text x="194" y="195">6</text><text x="242" y="195">8</text><text x="290" y="195">10</text>
    <text x="170" y="213">time (s)</text>
  </g>
  <g fill="#111827" text-anchor="end">
    <text x="44" y="184">0</text><text x="44" y="154">10</text><text x="44" y="124">20</text><text x="44" y="94">30</text><text x="44" y="64">40</text><text x="44" y="34">50</text>
  </g>
  <text x="12" y="105" fill="#111827" transform="rotate(-90 12 105)" text-anchor="middle">distance (m)</text>
  <line x1="50" y1="180" x2="290" y2="60" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="50" y1="180" x2="290" y2="150" stroke="#dc2626" stroke-width="2.5"/>
  <text x="255" y="68" fill="#2563eb" font-weight="bold">A</text>
  <text x="270" y="146" fill="#dc2626" font-weight="bold">B</text>
</svg>
